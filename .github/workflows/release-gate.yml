name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_deep_smoke:
        description: "Run deep YouTube lifecycle smoke"
        required: false
        default: "false"

jobs:
  release-checks:
    name: Release Checks (build + compile + env)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run release checks
        run: npm run release:checks

  api-smoke:
    name: API Smoke (docker)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: release-checks
    env:
      API_BASE_URL: http://localhost:8005

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Start backend stack
        run: docker compose up -d postgres redis backend worker

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS "$API_BASE_URL/health" > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Run baseline API smoke
        run: npm run smoke:api

      - name: Run deep API smoke
        if: inputs.run_deep_smoke == 'true'
        run: npm run smoke:api:deep

      - name: Print backend logs on failure
        if: failure()
        run: docker compose logs backend

      - name: Teardown
        if: always()
        run: docker compose down -v
