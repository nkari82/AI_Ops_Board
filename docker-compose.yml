services:
  # Frontend - Next.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8005
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-ops-network

  # Redis for Celery
  redis:
    image: redis:alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-password123}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-ops-network
    restart: unless-stopped

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8005}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aiopsboard
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password123}@redis:6379/0
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=${MISTRAL_MODEL}
      - MISTRAL_BASE_URL=${MISTRAL_BASE_URL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - CEREBRAS_MODEL=${CEREBRAS_MODEL}
      - CEREBRAS_BASE_URL=${CEREBRAS_BASE_URL}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY}
      - SAMBANOVA_MODEL=${SAMBANOVA_MODEL}
      - SAMBANOVA_BASE_URL=${SAMBANOVA_BASE_URL}
      - GOOGLE_AI_STUDIO_KEY=${GOOGLE_AI_STUDIO_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL}
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY}
      - POLLINATIONS_TEXT_MODEL=${POLLINATIONS_TEXT_MODEL}
      - POLLINATIONS_BASE_URL=${POLLINATIONS_BASE_URL}
      - LLM_FAILOVER_ENABLED=${LLM_FAILOVER_ENABLED:-true}
      - LLM_FAILOVER_ORDER=${LLM_FAILOVER_ORDER:-gemini,pollinations,groq,openrouter,mistral,deepseek,cerebras,sambanova,huggingface,vllm}
      - LLM_FAILOVER_ON_STATUS=${LLM_FAILOVER_ON_STATUS:-429,503,504}
      - CRAWL_ENABLED_SOURCES=${CRAWL_ENABLED_SOURCES:-reddit,github,hn,youtube,geeknews}
      - REDDIT_USE_RSS=${REDDIT_USE_RSS:-true}
      - REDDIT_RSS_FEEDS=${REDDIT_RSS_FEEDS:-https://www.reddit.com/r/LocalLLaMA/.rss}
      - REDDIT_RSS_MAX_CONTENT_CHUNKS=${REDDIT_RSS_MAX_CONTENT_CHUNKS:-4}
      - REDDIT_RSS_MAX_LINKS_PER_ENTRY=${REDDIT_RSS_MAX_LINKS_PER_ENTRY:-2}
      - REDDIT_RSS_FETCH_LINK_CONTENT=${REDDIT_RSS_FETCH_LINK_CONTENT:-true}
      - REDDIT_RSS_LINK_TIMEOUT_SECONDS=${REDDIT_RSS_LINK_TIMEOUT_SECONDS:-6}
      - REDDIT_RSS_MAX_LINK_CONTENT_CHARS=${REDDIT_RSS_MAX_LINK_CONTENT_CHARS:-1200}
      - REDDIT_RSS_SELFTEXT_MAX_CHARS=${REDDIT_RSS_SELFTEXT_MAX_CHARS:-4000}
      - REDDIT_RSS_LINK_MIN_TEXT_CHARS=${REDDIT_RSS_LINK_MIN_TEXT_CHARS:-160}
      - REDDIT_RSS_LINK_MAX_NOISE_RATIO=${REDDIT_RSS_LINK_MAX_NOISE_RATIO:-0.45}
      - REDDIT_RSS_LINK_MAX_SAME_LINE_RATIO=${REDDIT_RSS_LINK_MAX_SAME_LINE_RATIO:-0.6}
      - YOUTUBE_TARGET_URLS=${YOUTUBE_TARGET_URLS:-}
      - YOUTUBE_ALLOW_ALL_WHEN_TARGETS_EMPTY=${YOUTUBE_ALLOW_ALL_WHEN_TARGETS_EMPTY:-false}
      - YOUTUBE_SEARCH_ENABLED=${YOUTUBE_SEARCH_ENABLED:-true}
      - YOUTUBE_SEARCH_MAX_RESULTS=${YOUTUBE_SEARCH_MAX_RESULTS:-8}
      - YOUTUBE_SEARCH_MAX_PAGES=${YOUTUBE_SEARCH_MAX_PAGES:-2}
      - YOUTUBE_SEARCH_DEDUP_TTL_SECONDS=${YOUTUBE_SEARCH_DEDUP_TTL_SECONDS:-900}
      - YOUTUBE_SEARCH_RATE_LIMIT_WINDOW_SECONDS=${YOUTUBE_SEARCH_RATE_LIMIT_WINDOW_SECONDS:-60}
      - YOUTUBE_SEARCH_RATE_LIMIT_MAX_REQUESTS=${YOUTUBE_SEARCH_RATE_LIMIT_MAX_REQUESTS:-5}
      - GEEKNEWS_RSS_URL=${GEEKNEWS_RSS_URL:-https://news.hada.io/rss/news}
      - MIN_CLASSIFIABLE_CONTENT_LEN=${MIN_CLASSIFIABLE_CONTENT_LEN:-120}
      - MIN_CLASSIFIABLE_SIGNAL_LEN=${MIN_CLASSIFIABLE_SIGNAL_LEN:-160}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-ops-network
    volumes:
      - ./backend:/app

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info"]
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aiopsboard
      - REDIS_URL=redis://:${REDIS_PASSWORD:-password123}@redis:6379/0
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=${MISTRAL_MODEL}
      - MISTRAL_BASE_URL=${MISTRAL_BASE_URL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - CEREBRAS_MODEL=${CEREBRAS_MODEL}
      - CEREBRAS_BASE_URL=${CEREBRAS_BASE_URL}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY}
      - SAMBANOVA_MODEL=${SAMBANOVA_MODEL}
      - SAMBANOVA_BASE_URL=${SAMBANOVA_BASE_URL}
      - GOOGLE_AI_STUDIO_KEY=${GOOGLE_AI_STUDIO_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL}
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY}
      - POLLINATIONS_TEXT_MODEL=${POLLINATIONS_TEXT_MODEL}
      - POLLINATIONS_BASE_URL=${POLLINATIONS_BASE_URL}
      - LLM_FAILOVER_ENABLED=${LLM_FAILOVER_ENABLED:-true}
      - LLM_FAILOVER_ORDER=${LLM_FAILOVER_ORDER:-gemini,pollinations,groq,openrouter,mistral,deepseek,cerebras,sambanova,huggingface,vllm}
      - LLM_FAILOVER_ON_STATUS=${LLM_FAILOVER_ON_STATUS:-429,503,504}
      - CRAWL_ENABLED_SOURCES=${CRAWL_ENABLED_SOURCES:-reddit,github,hn,youtube,geeknews}
      - REDDIT_USE_RSS=${REDDIT_USE_RSS:-true}
      - REDDIT_RSS_FEEDS=${REDDIT_RSS_FEEDS:-https://www.reddit.com/r/LocalLLaMA/.rss}
      - REDDIT_RSS_MAX_CONTENT_CHUNKS=${REDDIT_RSS_MAX_CONTENT_CHUNKS:-4}
      - REDDIT_RSS_MAX_LINKS_PER_ENTRY=${REDDIT_RSS_MAX_LINKS_PER_ENTRY:-2}
      - REDDIT_RSS_FETCH_LINK_CONTENT=${REDDIT_RSS_FETCH_LINK_CONTENT:-true}
      - REDDIT_RSS_LINK_TIMEOUT_SECONDS=${REDDIT_RSS_LINK_TIMEOUT_SECONDS:-6}
      - REDDIT_RSS_MAX_LINK_CONTENT_CHARS=${REDDIT_RSS_MAX_LINK_CONTENT_CHARS:-1200}
      - REDDIT_RSS_SELFTEXT_MAX_CHARS=${REDDIT_RSS_SELFTEXT_MAX_CHARS:-4000}
      - REDDIT_RSS_LINK_MIN_TEXT_CHARS=${REDDIT_RSS_LINK_MIN_TEXT_CHARS:-160}
      - REDDIT_RSS_LINK_MAX_NOISE_RATIO=${REDDIT_RSS_LINK_MAX_NOISE_RATIO:-0.45}
      - REDDIT_RSS_LINK_MAX_SAME_LINE_RATIO=${REDDIT_RSS_LINK_MAX_SAME_LINE_RATIO:-0.6}
      - YOUTUBE_TARGET_URLS=${YOUTUBE_TARGET_URLS:-}
      - YOUTUBE_ALLOW_ALL_WHEN_TARGETS_EMPTY=${YOUTUBE_ALLOW_ALL_WHEN_TARGETS_EMPTY:-false}
      - YOUTUBE_SEARCH_ENABLED=${YOUTUBE_SEARCH_ENABLED:-true}
      - YOUTUBE_SEARCH_MAX_RESULTS=${YOUTUBE_SEARCH_MAX_RESULTS:-8}
      - YOUTUBE_SEARCH_MAX_PAGES=${YOUTUBE_SEARCH_MAX_PAGES:-2}
      - YOUTUBE_SEARCH_DEDUP_TTL_SECONDS=${YOUTUBE_SEARCH_DEDUP_TTL_SECONDS:-900}
      - YOUTUBE_SEARCH_RATE_LIMIT_WINDOW_SECONDS=${YOUTUBE_SEARCH_RATE_LIMIT_WINDOW_SECONDS:-60}
      - YOUTUBE_SEARCH_RATE_LIMIT_MAX_REQUESTS=${YOUTUBE_SEARCH_RATE_LIMIT_MAX_REQUESTS:-5}
      - GEEKNEWS_RSS_URL=${GEEKNEWS_RSS_URL:-https://news.hada.io/rss/news}
      - MIN_CLASSIFIABLE_CONTENT_LEN=${MIN_CLASSIFIABLE_CONTENT_LEN:-120}
      - MIN_CLASSIFIABLE_SIGNAL_LEN=${MIN_CLASSIFIABLE_SIGNAL_LEN:-160}
    depends_on:
      - redis
      - postgres
    networks:
      - ai-ops-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aiopsboard
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-ops-network

networks:
  ai-ops-network:
    driver: bridge

volumes:
  postgres_data:
