services:
  # Frontend - Next.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-ops-network

  # Redis for Celery
  redis:
    image: redis:alpine
    command: ["redis-server", "--requirepass", "password123"]
    ports:
      - "6379:6379"
    networks:
      - ai-ops-network
    restart: unless-stopped

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8005}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aiopsboard
      - REDIS_URL=redis://:password123@redis:6379/0
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - ai-ops-network
    volumes:
      - ./backend:/app

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info"]
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/aiopsboard
      - REDIS_URL=redis://:password123@redis:6379/0
    depends_on:
      - redis
      - postgres
    networks:
      - ai-ops-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aiopsboard
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ai-ops-network

networks:
  ai-ops-network:
    driver: bridge

volumes:
  postgres_data: